name: TryHackMe Badge Update

on:
  schedule:
    - cron: '0 0 * * *' # Automatyczna aktualizacja codziennie o północy
  workflow_dispatch: # Przycisk do ręcznego uruchomienia

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download THM Badge
        run: |
          curl -s https://tryhackme-badges.s3.amazonaws.com/Svqxcw.png -o thm-badge.png || true

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add thm-badge.png
          git commit -m "Update TryHackMe badge" || exit 0
          git push
